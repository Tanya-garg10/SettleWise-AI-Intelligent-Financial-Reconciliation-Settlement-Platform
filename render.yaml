# Render Blueprint specification for SettleWise AI
# Deploys Full-Stack React + Node/FastAPI Services with Managed PostgreSQL

services:
  # 1. Full-Stack Web Service (Vite SPA + Express Orchestration Layer)
  - type: web
    name: settlewise-ai-app
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WEBHOOK_ID
        sync: false

  # 2. Optional FastAPI Backend Service (For multi-service architecture)
  - type: web
    name: settlewise-api-fastapi
    runtime: python
    plan: starter
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        fromDatabase:
          name: settlewise-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com

databases:
  # Managed PostgreSQL on Render
  - name: settlewise-postgres
    plan: free
    databaseName: settlewise_db
    user: settlewise_admin
